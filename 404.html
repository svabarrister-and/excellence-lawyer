<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Excellence Law Firm</title>
<meta name="robots" content="noindex,follow" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#22262b" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#22262b;--paper:#fbfaf7;--gold:#a9843f;--muted:#7b8088;
        --serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;
       display:flex;align-items:center;justify-content:center;padding:40px 24px;line-height:1.65}
  .box{max-width:560px;text-align:center}
  .brand{font-family:var(--serif);font-size:22px;letter-spacing:.03em;margin-bottom:48px}
  .brand span{color:var(--gold)}
  .code{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,6vw,46px);line-height:1.1;margin-bottom:18px}
  p{color:var(--muted);font-size:15px;margin-bottom:8px}
  p.alt{font-size:13.5px}
  a.cta{display:inline-block;margin-top:32px;padding:14px 30px;border:1px solid var(--ink);
        color:var(--ink);text-decoration:none;font-size:13.5px;letter-spacing:.06em;transition:.3s}
  a.cta:hover{background:var(--ink);color:var(--paper)}
  .foot{margin-top:44px;font-size:12px;color:var(--muted)}
  .foot a{color:var(--muted)}
</style>
</head>
<body>
  <div class="box">
    <div class="brand">Excellence<span>.</span> Law Firm</div>
    <div class="code">404</div>
    <h1>Сторінку не знайдено</h1>
    <p>Можливо, адресу змінено або сторінку видалено.</p>
    <p class="alt">Страница не найдена · Page not found</p>
    <a class="cta" href="/">На головну</a>
    <div class="foot">+380 67 243 7041 · <a href="mailto:sva@excellence.lawyer">sva@excellence.lawyer</a></div>
  </div>
</body>
</html>
